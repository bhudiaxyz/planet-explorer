# .github/workflows/deploy-pages.yml — build the app and publish it to GitHub Pages.
#
# Purpose:
#   CI/CD for the static site: builds with Vite and deploys the dist folder to GitHub Pages.
#
# Operations:
#   - Triggers: push to main, or manual workflow_dispatch.
#   - Job build: checkout, Node 24 with npm cache, configure-pages, `npm ci`, `npm run build` (tsc --noEmit + vite
#     build), upload dist as the Pages artifact.
#   - Job deploy: runs after build in the github-pages environment via actions/deploy-pages.
#
# Usage:
#   Runs on GitHub automatically; no local invocation. Pages source must be set to "GitHub Actions" in repo settings.
#
# Important:
#   - A type error fails the build (npm run build runs tsc first), so nothing is deployed.
#   - concurrency group "pages" with cancel-in-progress false: queued deploys finish rather than being cancelled.
#   - The base path in vite.config.ts must match the Pages URL.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
